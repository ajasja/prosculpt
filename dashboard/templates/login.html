<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prosculpt Dashboard</title>
<style>
  :root {
    --bg: #0f1420; --panel: #161d2e; --border: #2a3550; --text: #e6e9f0;
    --muted: #9aa4bd; --accent: #5b8cff; --danger: #ef5a6f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .login-card {
    width: min(340px, 90vw); background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 28px 26px; box-shadow: 0 8px 28px rgba(0,0,0,0.4);
  }
  h1 { font-size: 18px; margin: 0 0 20px; text-align: center; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  input[type="password"] {
    width: 100%; padding: 9px 11px; background: #1d2740; border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; font-size: 13.5px; margin-bottom: 14px;
  }
  button {
    width: 100%; padding: 10px; background: var(--accent); color: #fff; border: none;
    border-radius: 6px; font-size: 13.5px; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .error {
    color: var(--danger); font-size: 12.5px; margin: -6px 0 14px; text-align: center;
  }
</style>
</head>
<body>
  <div class="login-card">
    <h1>Prosculpt Dashboard</h1>
    <form method="post">
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autofocus autocomplete="current-password">
      <button type="submit">Enter</button>
    </form>
  </div>
</body>
</html>
